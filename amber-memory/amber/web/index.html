<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>amber</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-canvas: #fafafb;
    --bg-subtle: #f4f5f7;
    --bg-hover: #eff1f4;
    --bg-active: #ebedf3;
    --border: #e5e7eb;
    --border-subtle: #eef0f3;
    --border-strong: #d1d5db;
    --text: #111827;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;
    --accent: #5e6ad2;
    --accent-bg: #eef0ff;
    --green: #15803d;
    --green-bg: #ecfdf3;
    --green-border: #bbf7d0;
    --red: #b91c1c;
    --red-bg: #fef2f2;
    --red-border: #fecaca;
    --amber: #b45309;
    --amber-bg: #fffbeb;
    --amber-border: #fde68a;
    --radius: 7px;
    --shadow-card: 0 1px 2px rgba(16, 24, 40, 0.04);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    --font-mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  [data-theme="dark"] {
    --bg: #111318;
    --bg-canvas: #0d0f13;
    --bg-subtle: #171a22;
    --bg-hover: #1e222d;
    --bg-active: #242938;
    --border: #262b36;
    --border-subtle: #1f242e;
    --border-strong: #373f51;
    --text: #f3f4f6;
    --text-muted: #9ca3af;
    --text-faint: #6b7280;
    --accent: #7c87f0;
    --accent-bg: #1e2240;
    --green: #4ade80;
    --green-bg: #0f291a;
    --green-border: #166534;
    --red: #f87171;
    --red-bg: #2c1215;
    --red-border: #7f1d1d;
    --amber: #fbbf24;
    --amber-bg: #2b1f0d;
    --amber-border: #78350f;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.25);
  }

  @keyframes viewIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes drawerIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg-canvas);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
    transition: background-color 0.2s var(--ease), color 0.2s var(--ease);
  }

  button, input, select, textarea {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
  }

  .app {
    display: grid;
    grid-template-columns: 196px 1fr;
    height: 100vh;
    overflow: hidden;
    transition: grid-template-columns 0.24s var(--ease);
  }

  .app.collapsed { grid-template-columns: 54px 1fr; }

  /* Sidebar */
  .sidebar {
    background: var(--bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px 10px;
    gap: 14px;
    user-select: none;
    overflow: hidden;
    transition: background-color 0.2s var(--ease), border-color 0.2s var(--ease), padding 0.24s var(--ease);
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 2px 4px 2px 6px;
    min-height: 28px;
  }

  .brand-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .brand-name { font-weight: 600; font-size: 13.5px; letter-spacing: -0.015em; white-space: nowrap; }

  .brand-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    transition: transform 0.2s var(--ease);
  }

  .brand:hover .brand-dot { transform: scale(1.18); }
  .ver { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); }

  .collapse-btn {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border: none;
    background: transparent;
    border-radius: 5px;
    cursor: pointer;
    color: var(--text-muted);
    flex-shrink: 0;
    transition: background-color 0.14s var(--ease), color 0.14s var(--ease), transform 0.14s var(--ease);
  }

  .collapse-btn:hover { background: var(--bg-hover); color: var(--text); }
  .collapse-btn:active { transform: scale(0.93); }

  .nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }

  .nav-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 7px 9px;
    border: none;
    background: transparent;
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--text-muted);
    font-weight: 500;
    transition: background-color 0.15s var(--ease), color 0.15s var(--ease), transform 0.12s var(--ease);
  }

  .nav-btn:hover { background: var(--bg-hover); color: var(--text); }
  .nav-btn:active { transform: scale(0.98); }
  .nav-btn.active { background: var(--bg-active); color: var(--text); }

  .nav-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .nav-label { white-space: nowrap; }

  .nav-icon {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.85;
    flex-shrink: 0;
  }

  .count-badge { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }

  .sidebar-footer {
    display: flex;
    align-items: center;
    gap: 5px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .cmd-trigger {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    border: 1px solid var(--border);
    background: var(--bg-canvas);
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--text-muted);
    font-size: 12px;
    min-width: 0;
    height: 29px;
    transition: border-color 0.15s var(--ease), color 0.15s var(--ease), transform 0.12s var(--ease);
  }

  .cmd-trigger:hover { border-color: var(--border-strong); color: var(--text); }
  .cmd-trigger:active { transform: scale(0.97); }
  .kbd { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); }

  .icon-btn {
    min-width: 29px;
    height: 29px;
    padding: 0 6px;
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    background: var(--bg-canvas);
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--text-muted);
    font-size: 11.5px;
    font-weight: 500;
    transition: border-color 0.15s var(--ease), color 0.15s var(--ease), transform 0.12s var(--ease);
  }

  .icon-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .icon-btn:active { transform: scale(0.94); }

  .app.collapsed .sidebar { padding: 12px 9px; align-items: center; }
  .app.collapsed .brand { justify-content: center; padding: 2px 0; width: 100%; }
  .app.collapsed .brand-left { display: none; }
  .app.collapsed .nav { align-items: center; width: 100%; }
  .app.collapsed .nav-btn { width: 34px; height: 34px; padding: 0; justify-content: center; }
  .app.collapsed .nav-label, .app.collapsed .count-badge { display: none; }
  .app.collapsed .sidebar-footer { flex-direction: column; width: 100%; gap: 6px; }
  .app.collapsed .cmd-trigger { width: 34px; height: 30px; padding: 0; justify-content: center; flex: none; }
  .app.collapsed .cmd-label { display: none; }
  .app.collapsed .icon-btn { width: 34px; height: 30px; padding: 0; }

  /* Main */
  .main { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .view { display: none; height: 100%; overflow: hidden; }
  .view.active { display: flex; flex-direction: column; animation: viewIn 0.18s var(--ease) both; }

  /* Master-Detail */
  .split { display: grid; grid-template-columns: 276px 1fr; height: 100%; overflow: hidden; }

  .list-pane {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    transition: background-color 0.2s var(--ease), border-color 0.2s var(--ease);
  }

  .pane-header {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 10px;
    border-bottom: 1px solid var(--border);
  }

  .search-input {
    width: 100%;
    padding: 6px 9px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-canvas);
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s var(--ease), background-color 0.15s var(--ease);
  }

  .search-input:focus { border-color: var(--accent); background: var(--bg); }

  .seg {
    display: inline-flex;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2px;
    gap: 2px;
  }

  .seg-btn {
    border: none;
    background: transparent;
    padding: 3px 8px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 500;
    transition: background-color 0.16s var(--ease), color 0.16s var(--ease), box-shadow 0.16s var(--ease), transform 0.1s var(--ease);
  }

  .seg-btn:active { transform: scale(0.96); }
  .seg-btn.active { background: var(--bg); color: var(--text); box-shadow: var(--shadow-card); }

  .entry-list {
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .entry-item {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 9px 10px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    background: transparent;
    text-align: left;
    cursor: pointer;
    width: 100%;
    transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), transform 0.12s var(--ease);
  }

  .entry-item:hover { background: var(--bg-hover); }
  .entry-item:active { transform: scale(0.99); }
  .entry-item.active {
    background: var(--bg-canvas);
    border-color: var(--border);
    box-shadow: var(--shadow-card);
  }

  .entry-item-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .entry-key {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .entry-snippet {
    font-size: 11.5px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .entry-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-faint);
  }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot.active { background: var(--green); }
  .dot.superseded { background: var(--amber); }
  .dot.revoked { background: var(--red); }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.25;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text-muted);
    white-space: nowrap;
    transition: background-color 0.16s var(--ease), color 0.16s var(--ease), border-color 0.16s var(--ease);
  }

  .tag.accent { color: var(--accent); background: var(--accent-bg); border-color: transparent; }
  .tag.green { color: var(--green); background: var(--green-bg); border-color: var(--green-border); }
  .tag.red { color: var(--red); background: var(--red-bg); border-color: var(--red-border); }
  .tag.amber { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-border); }

  .detail-pane {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
    background: var(--bg-canvas);
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    min-height: 46px;
    transition: background-color 0.2s var(--ease), border-color 0.2s var(--ease);
  }

  .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: background-color 0.14s var(--ease), border-color 0.14s var(--ease), color 0.14s var(--ease), transform 0.1s var(--ease);
  }

  .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.active-base { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .btn.danger-on { border-color: var(--red-border); color: var(--red); background: var(--red-bg); }

  .scroll-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Metrics strip */
  .metrics {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }

  .metric {
    padding: 11px 14px;
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 4px;
    min-width: 0;
  }

  .metric:last-child { border-right: none; }
  .metric-k { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .metric-v {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Apple Notes Content Card */
  .note-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }

  .note-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 9px 14px;
    background: var(--bg-canvas);
    border-bottom: 1px solid var(--border-subtle);
  }

  .note-body {
    padding: 16px 18px;
    font-size: 13.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .redacted-token {
    font-family: var(--font-mono);
    font-size: 11.5px;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--amber-bg);
    color: var(--amber);
    border: 1px solid var(--amber-border);
  }

  /* Lineage strip */
  .lineage-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .lineage-node {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 8px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    font-family: var(--font-mono);
    font-size: 11.5px;
    cursor: pointer;
    transition: border-color 0.14s var(--ease), background-color 0.14s var(--ease), transform 0.1s var(--ease);
  }

  .lineage-node:hover { border-color: var(--border-strong); background: var(--bg-hover); }
  .lineage-node:active { transform: scale(0.96); }
  .lineage-node.current { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }

  /* Inline Supersede Composer */
  .composer-card {
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    overflow: hidden;
    animation: drawerIn 0.16s var(--ease) both;
  }

  .composer-ta {
    width: 100%;
    min-height: 110px;
    border: none;
    resize: vertical;
    padding: 12px 14px;
    background: var(--bg);
    font-size: 13px;
    line-height: 1.55;
    outline: none;
  }

  .composer-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg-subtle);
    border-top: 1px solid var(--border-subtle);
  }

  /* Tables */
  .table-wrap {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    overflow-x: auto;
  }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }

  th {
    text-align: left;
    font-weight: 500;
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg-canvas);
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border-subtle);
    vertical-align: middle;
    transition: background-color 0.12s var(--ease);
  }

  tr:last-child td { border-bottom: none; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--bg-hover); }

  .mono { font-family: var(--font-mono); font-size: 12px; }
  .muted { color: var(--text-muted); }

  /* Controls */
  select, input[type="number"], input[type="text"] {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: var(--radius);
    padding: 5px 8px;
    font-size: 12px;
    outline: none;
    transition: border-color 0.14s var(--ease);
  }

  select:focus, input:focus, textarea:focus { border-color: var(--accent); }
  .num-input { width: 76px; font-family: var(--font-mono); }

  .field-inline { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-muted); }

  .check-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-muted);
    user-select: none;
    transition: border-color 0.15s var(--ease), background-color 0.15s var(--ease), color 0.15s var(--ease);
  }

  .check-chip input { accent-color: var(--accent); cursor: pointer; }
  .check-chip.on { color: var(--text); border-color: var(--border-strong); background: var(--bg-subtle); }

  /* Write two-column */
  .editor-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    flex: 1;
    min-height: 0;
  }

  .editor-col {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    overflow: hidden;
    min-height: 280px;
  }

  .editor-head {
    padding: 8px 12px;
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .editor-ta {
    flex: 1;
    width: 100%;
    border: none;
    resize: none;
    padding: 12px 14px;
    background: var(--bg);
    font-size: 13px;
    line-height: 1.6;
    outline: none;
  }

  .preview-pane {
    flex: 1;
    padding: 12px 14px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Budget bar (gliding in-place) */
  .budget-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .budget-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11.5px;
  }

  .budget-track {
    height: 10px;
    border-radius: 5px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .budget-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.34s var(--ease), background-color 0.2s var(--ease);
  }

  .budget-fill.full { background: var(--amber); }

  /* Audit Banner */
  .verdict-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 11px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    box-shadow: var(--shadow-card);
    transition: background-color 0.24s var(--ease), border-color 0.24s var(--ease);
  }

  .verdict-bar.ok { background: var(--green-bg); border-color: var(--green-border); }
  .verdict-bar.broken { background: var(--red-bg); border-color: var(--red-border); }
  .verdict-pill { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.03em; }
  .verdict-bar.ok .verdict-pill { color: var(--green); }
  .verdict-bar.broken .verdict-pill { color: var(--red); }

  .code-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 12px 14px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 460px;
    animation: viewIn 0.16s var(--ease) both;
  }

  /* Settings */
  .settings-wrap { max-width: 620px; width: 100%; display: flex; flex-direction: column; gap: 14px; }

  .settings-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }

  .settings-head {
    padding: 8px 14px;
    background: var(--bg-canvas);
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .setting-row:last-child { border-bottom: none; }
  .setting-k { font-size: 12.5px; font-weight: 500; }
  .setting-k.mono { font-family: var(--font-mono); font-size: 12px; }

  .switch { position: relative; display: inline-block; width: 34px; height: 19px; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track { position: absolute; inset: 0; background: var(--border-strong); border-radius: 99px; transition: background-color 0.18s var(--ease); }
  .switch-track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
    transition: transform 0.2s var(--ease);
  }
  .switch input:checked + .switch-track { background: var(--accent); }
  .switch input:checked + .switch-track::after { transform: translateX(15px); }

  /* Command Palette */
  .cmd-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.34);
    backdrop-filter: blur(2px);
    z-index: 50;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 12vh;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s var(--ease);
  }

  .cmd-backdrop.open { opacity: 1; pointer-events: auto; }

  .cmd-modal {
    width: min(500px, 92vw);
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.18);
    overflow: hidden;
    transform: translateY(-6px) scale(0.975);
    transition: transform 0.18s var(--ease);
  }

  .cmd-backdrop.open .cmd-modal { transform: translateY(0) scale(1); }

  .cmd-input {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 12px 14px;
    background: var(--bg);
    font-size: 13.5px;

  .cmd-list { max-height: 300px; overflow-y: auto; padding: 6px; }

  .cmd-item {

  function fnvHex(str) {
    let h1 = 0x811c9dc5, h2 = 0x9e3779b9;
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
      h2 = Math.imul(h2 ^ (c + i), 0x85ebca6b) >>> 0;
    }
    return (h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0'));
  }

  function estTokens(text) {
    return Math.max(1, Math.ceil(String(text || '').length / 3.8));
  }

  const REDACT_RULES = [
    { name: 'OPENAI_KEY', re: /\bsk-[A-Za-z0-9_-]{16,}\b/g },
    { name: 'GITHUB_PAT', re: /\bgh[pousr]_[A-Za-z0-9]{16,}\b/g },
    { name: 'AWS_KEY', re: /\bAKIA[0-9A-Z]{16}\b/g },
    { name: 'BEARER_TOKEN', re: /\bBearer\s+[A-Za-z0-9._-]{12,}\b/gi },
    { name: 'DB_URI', re: /\b(?:postgres|mysql|mongodb):\/\/[^\s"']+/gi },
    { name: 'PRIVATE_KEY', re: /-----BEGIN [A-Z ]+ PRIVATE KEY-----[\s\S]*?-----END [A-Z ]+ PRIVATE KEY-----/g }
  ];

  function redactText(raw, enabled = true) {
    if (!enabled) return { text: raw, hits: [] };
    let out = String(raw || '');
    const hits = [];
    REDACT_RULES.forEach(rule => {
      out = out.replace(rule.re, () => {
        hits.push(rule.name);
        return `[REDACTED:${rule.name}]`;
      });
    });
    return { text: out, hits };
  }

  function formatRedactedHtml(text) {
    return escapeHtml(text).replace(/\[REDACTED:[A-Z_]+\]/g, m => `<span class="redacted-token">${m}</span>`);
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    const ts = new Date(Date.UTC(2026, 10, 19, 10, seq * 3, 0)).toISOString().slice(11, 19) + 'Z';
    const event_hash = fnvHex(`${seq}|${action}|${target_id}|${actor}|${prev_hash}`);
    auditLog.push({ seq, action, target_id, actor, ts, prev_hash, event_hash });
  }

  // Recall View
  function scoreEntry(entry, query) {
    const terms = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return 1.0;
    const hay = (entry.key + ' ' + entry.content + ' ' + entry.scope).toLowerCase();
    let hits = 0;
    terms.forEach(w => { if (hay.includes(w)) hits += 1; });
    const tierBoost = entry.tier === 'L3' ? 0.15 : entry.tier === 'L2' ? 0.1 : 0;
    return Math.min(1, (hits / terms.length) + (hits > 0 ? tierBoost : 0));
  }

  function renderRecall() {
    $('recallQuery').value = state.recallQuery;
    $('recallScope').value = state.recallScope;
    $('recallBudget').value = state.recallBudget;
    $('recallActiveOnly').checked = state.recallActiveOnly;

    $('recallJsonBtn').classList.toggle('active-base', state.showRecallJson);
    document.querySelectorAll('#view-recall .check-chip').forEach(c => c.classList.toggle('on', c.querySelector('input').checked));

    const scored = entries.map(e => {
      const scopeOk = state.recallScope === 'all' || e.scope === state.recallScope;
      const statusOk = !state.recallActiveOnly || e.status === 'active';
      const sigOk = !state.recallStrictSig || Boolean(e.signature);
      const eligible = scopeOk && statusOk && sigOk;
      const sc = scoreEntry(e, state.recallQuery);
      return { entry: e, eligible, score: sc };
    }).sort((a, b) => Number(b.eligible) - Number(a.eligible) || b.score - a.score);

    let used = 0;
    let incCount = 0;
    const rows = scored.map(item => {
      let stateTag = 'excluded';
      if (item.eligible && item.score > 0) {
        if (used + item.entry.tokens <= state.recallBudget) {
          used += item.entry.tokens;
          incCount += 1;
          stateTag = 'included';
        } else {
          stateTag = 'budget_cut';
        }
      }
      return { ...item, stateTag };
    });

    const pctFill = Math.min(100, (used / Math.max(1, state.recallBudget)) * 100);
    $('budgetUsedLbl').textContent = `${used} / ${state.recallBudget} tok`;
    $('budgetCountLbl').textContent = `${incCount} / ${entries.length}`;
    $('budgetFill').style.width = pctFill.toFixed(1) + '%';

    if (state.showRecallJson) {

        token_budget: state.recallBudget,
        tokens_used: used,

          key: r.entry.key,
          version: r.entry.version,
          tier: r.entry.tier,

      return;

                  <td class="mono">${escapeHtml(r.entry.key)} <span class="muted">v${r.entry.version}</span></td>

  function renderAudit() {
    $('auditCount').textContent = String(auditLog.length);
    $('tamperAuditBtn').classList.toggle('danger-on', state.auditTamperedIdx >= 0);

    let brokenAt = -1;
    const verified = auditLog.map((ev, idx) => {
      const expectedPrev = idx === 0 ? '0000000000000000' : auditLog[idx - 1].event_hash;
      const expectedHash = fnvHex(`${ev.seq}|${ev.action}|${ev.target_id}|${ev.actor}|${expectedPrev}`);
      const tamperedHere = idx === state.auditTamperedIdx;
      const shownHash = tamperedHere ? 'deadbeef00000000' : ev.event_hash;
      const ok = brokenAt === -1 && !tamperedHere && ev.prev_hash === expectedPrev && shownHash === expectedHash;
      if (!ok && brokenAt === -1) brokenAt = ev.seq;
      return { ...ev, shownHash, ok };
    });

    const filtered = verified.filter(ev => state.auditFilter === 'all' || ev.action === state.auditFilter);
    const chainOk = brokenAt === -1;

    $('auditBody').innerHTML = `
      <div class="verdict-bar ${chainOk ? 'ok' : 'broken'}">

          <span class="verdict-pill">${chainOk ? t('chain_valid') : t('chain_broken')}</span>

            <span class="setting-k mono">default_recall_budget</span>
            <input class="num-input" id="setDefBudget" type="number" step="50" min="50" max="4096" value="${state.settings.default_recall_budget}">
          </div>
        </div>
      </div>
    `;

    $('setLangSeg').querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
    $('setThemeSeg').querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => { setTheme(b.dataset.th); renderSettings(); }));
    $('setApiToken').addEventListener('change', e => {
      apiToken = e.target.value.trim();
      try { localStorage.setItem('amber_api_token', apiToken); } catch {}
      syncFromBackend();
    });
    $('setAutoRedact').addEventListener('change', e => { state.settings.auto_redact = e.target.checked; updateWritePreview(); });
    $('setFailClosed').addEventListener('change', e => { state.settings.fail_closed_sig = e.target.checked; state.recallStrictSig = e.target.checked; });
    $('setTtl').addEventListener('input', e => { state.settings.default_ttl_days = Math.max(1, Number(e.target.value) || 90); });
    $('setDefBudget').addEventListener('input', e => {
      const val = Math.max(50, Number(e.target.value) || 220);
      state.settings.default_recall_budget = val;
      state.recallBudget = val;
    });
  }

  // Command Palette
  function openCmd() {
    $('cmdModal').classList.add('open');
    $('cmdInput').value = '';
    renderCmdList('');
    $('cmdInput').focus();
  }

  function closeCmd() { $('cmdModal').classList.remove('open'); }

  function renderCmdList(q) {
    const query = q.trim().toLowerCase();
    const views = [
      { id: 'entries', label: t('nav_entries') },
      { id: 'write', label: t('nav_write') },
      { id: 'recall', label: t('nav_recall') },
      { id: 'audit', label: t('nav_audit') },
      { id: 'settings', label: t('nav_settings') }
    ];
    const items = [
      ...views.map(v => ({ label: v.label, kind: t('lbl_view'), action: () => switchView(v.id) })),
      ...entries.map(e => ({ label: `${e.key} (v${e.version})`, kind: e.status, action: () => { state.selectedId = e.id; switchView('entries'); } }))
    ].filter(i => !query || i.label.toLowerCase().includes(query) || i.kind.toLowerCase().includes(query));

    $('cmdList').innerHTML = items.map((it, idx) => `
      <button class="cmd-item" data-idx="${idx}">
        <span class="mono">${escapeHtml(it.label)}</span>
        <span class="tag">${escapeHtml(it.kind)}</span>
      </button>
    `).join('');

    $('cmdList').querySelectorAll('.cmd-item').forEach(el => {
      el.addEventListener('click', () => { items[Number(el.dataset.idx)].action(); closeCmd(); });
    });
  }

  // Static listeners
  document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
  $('entrySearch').addEventListener('input', e => { state.entryQuery = e.target.value; renderEntries(); });
  document.querySelectorAll('#statusFilter .seg-btn').forEach(b => {
    b.addEventListener('click', () => {
      state.statusFilter = b.dataset.st;
      document.querySelectorAll('#statusFilter .seg-btn').forEach(x => x.classList.toggle('active', x === b));
      renderEntries();
    });
  });

  $('entryList').addEventListener('click', e => {
    const item = e.target.closest('.entry-item');
    if (!item) return;
    state.selectedId = item.dataset.id;
    state.showSupersede = false;
    renderEntries();
  });

  $('writeInput').value = SAMPLES.secret;
  $('writeInput').addEventListener('input', updateWritePreview);
  document.querySelectorAll('#sampleSeg .seg-btn').forEach(b => {
    b.addEventListener('click', () => {
      $('writeInput').value = SAMPLES[b.dataset.sample];
      updateWritePreview();
    });
  });

  $('commitBtn').addEventListener('click', async () => {
    const key = ($('writeKey').value || '').trim() || ('mem_key_' + (entries.length + 1));
    const raw = ($('writeInput').value || '').trim();
    if (!raw) return;
    const scope = $('writeScope').value;
    if (backendOnline) {
      const res = await postBackend('/api/memory/write', { scope, body: raw, session: 'web-ui' });
      if (!res || !res.item_id) return;
      await syncFromBackend();
      state.selectedId = res.item_id;
      state.statusFilter = 'all';
      document.querySelectorAll('#statusFilter .seg-btn').forEach(x => x.classList.toggle('active', x.dataset.st === 'all'));
      switchView('entries');
      return;
    }
    const prevActive = entries.find(e => e.key === key && e.status === 'active');
    if (prevActive) prevActive.status = 'superseded';
    const created = addEntry({
      key,
      scope,
      tier: $('writeTier').value,
      version: prevActive ? prevActive.version + 1 : 1,
      status: 'active',
      supersedes: prevActive ? prevActive.id : null,
      raw,
      ttl_days: state.settings.default_ttl_days
    });
    state.selectedId = created.id;
    state.statusFilter = 'all';
    document.querySelectorAll('#statusFilter .seg-btn').forEach(x => x.classList.toggle('active', x.dataset.st === 'all'));
    switchView('entries');
  });

  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (parsed.key) $('writeKey').value = parsed.key;
        if (parsed.content) $('writeInput').value = parsed.content;
        else $('writeInput').value = JSON.stringify(parsed, null, 2);
        updateWritePreview();
      } catch { /* ignore invalid json */ }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  $('recallQuery').addEventListener('input', e => { state.recallQuery = e.target.value; renderRecall(); });
  $('recallScope').addEventListener('change', e => { state.recallScope = e.target.value; renderRecall(); });
  $('recallBudget').addEventListener('input', e => { state.recallBudget = Math.max(50, Math.min(4096, Number(e.target.value) || 220)); renderRecall(); });
  $('recallActiveOnly').addEventListener('change', e => { state.recallActiveOnly = e.target.checked; renderRecall(); });
  $('recallStrictSig').addEventListener('change', e => { state.recallStrictSig = e.target.checked; renderRecall(); });
  $('recallJsonBtn').addEventListener('click', () => { state.showRecallJson = !state.showRecallJson; renderRecall(); });

  document.querySelectorAll('#auditFilter .seg-btn').forEach(b => {
    b.addEventListener('click', () => {
      state.auditFilter = b.dataset.af;
      document.querySelectorAll('#auditFilter .seg-btn').forEach(x => x.classList.toggle('active', x === b));
      renderAudit();
    });
  });

  $('tamperAuditBtn').addEventListener('click', () => {
    state.auditTamperedIdx = state.auditTamperedIdx >= 0 ? -1 : Math.max(0, Math.floor(auditLog.length / 2));
    renderAudit();
  });

  $('resetSettingsBtn').addEventListener('click', () => {
    state.settings = {
      journal_mode: 'WAL',
      encryption: 'chacha20-poly1305',
      key_id: '8a4f2c91',
      auto_redact: true,
      fail_closed_sig: true,
      default_ttl_days: 90,
      default_recall_budget: 220
    };
    state.recallBudget = 220;
    state.recallStrictSig = true;
    setTheme('light');
    renderSettings();
  });

  $('collapseBtn').addEventListener('click', toggleSidebar);
  $('langBtn').addEventListener('click', () => setLang(state.lang === 'en' ? 'zh' : 'en'));
  $('themeBtn').addEventListener('click', () => setTheme(state.theme === 'dark' ? 'light' : 'dark'));

  $('cmdBtn').addEventListener('click', openCmd);
  $('cmdModal').addEventListener('click', e => { if (e.target === $('cmdModal')) closeCmd(); });
  $('cmdInput').addEventListener('input', e => renderCmdList(e.target.value));
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleSidebar(); }
    if (e.key === 'Escape') closeCmd();
  });


  // Live backend sync when served by amber.server (falls back to in-memory sample data offline)
  let backendOnline = false;
  let serverHealth = null;
  let apiToken = '';
  try { apiToken = localStorage.getItem('amber_api_token') || ''; } catch {}

  function apiHeaders(json = false) {
    const hdr = {};
    if (json) hdr['Content-Type'] = 'application/json';
    if (apiToken) hdr['Authorization'] = 'Bearer ' + apiToken;
    return hdr;
  }

  function showApiError(msg) {
    let el = document.getElementById('amberErrorBanner');
    if (!el) {
      el = document.createElement('div');
      el.id = 'amberErrorBanner';
      el.style.cssText = 'position:fixed;bottom:14px;right:14px;z-index:9999;background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);padding:8px 12px;border-radius:7px;font-size:12px;max-width:420px;box-shadow:0 4px 14px rgba(0,0,0,0.12);';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.style.display = 'none'; }, 6000);
  }

  async function syncFromBackend() {
    if (!location.protocol.startsWith('http')) return;
    try {
      const h = await fetch('/api/health');
      if (!h.ok) return;
      serverHealth = await h.json();
      backendOnline = true;
      const sr = await fetch('/api/memory/items?limit=50', { headers: apiHeaders() });
      if (sr.status === 401 || sr.status === 403) {
        entries.length = 0;
        auditLog.length = 0;
        showApiError('Authentication required (' + sr.status + '). Set your API Bearer token in Settings.');
        renderCurrentView();
        return;
      }
      if (!sr.ok) {
        showApiError('Failed to load items: HTTP ' + sr.status);
        return;
      }
      const data = await sr.json();
      entries.length = 0;
      (data.items || []).forEach(hit => {
        entries.push({
          id: hit.id,
          key: hit.id.slice(0, 12),
          scope: hit.scope || 'default',
          tier: 'L2',
          version: 1,
          status: hit.state || 'active',
          supersedes: null,
          content: hit.body || '',
          redactions: [],
          tokens: estTokens(hit.body || ''),
          ttl_days: state.settings.default_ttl_days,
          key_id: 'server',
          content_sha256: (hit.evidence_hash || '').slice(0, 16),
          signature: 'backend-verified'
        });
      });
      state.selectedId = entries.length ? entries[0].id : null;
      const ar = await fetch('/api/memory/audit?scope=default', { headers: apiHeaders() });
      if (ar.ok) {
        const ad = await ar.json();
        auditLog.length = 0;
        (ad.events || []).forEach(ev => {
          auditLog.push({
            seq: ev.seq,
            action: ev.action || '',
            target_id: ev.scope || '',
            actor: ev.actor || '',
            ts: ev.created || '',
            prev_hash: ev.prev_hash || '',
            event_hash: ev.event_hash || ''
          });
        });
      }
      renderCurrentView();
    } catch { /* offline preview mode */ }
  }

  async function postBackend(path, body) {
    if (!backendOnline) return null;
    try {
      const resp = await fetch(path, { method: 'POST', headers: apiHeaders(true), body: JSON.stringify(body) });
      if (!resp.ok) {
        let detail = 'HTTP ' + resp.status;
        try { const j = await resp.json(); if (j.detail) detail += ': ' + j.detail; } catch {}
        showApiError(detail);
        return null;
      }
      return await resp.json();
    } catch (err) {
      showApiError('Network error: ' + err.message);
      return null;
    }
  }

  applyStaticI18n();
  renderEntries();
  syncFromBackend();
})();
</script>
</body>
</html>
