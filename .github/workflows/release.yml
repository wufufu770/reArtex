name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 Release 需要
  packages: write # 推 ghcr.io 镜像需要

jobs:
  # ⓪ 安全门：编译 + vet + 全量测试（复用 ci.yml）
  #
  # 放在 binaries 之前：测试不过就不产出二进制，更不发布。此前本仓库的唯一
  # workflow 只有 release，且其中 go test / npm test / security 命中数为 0 ——
  # 也就是说没有任何测试门，坏掉的测试可以一直烂在那里没人发现。
  test:
    uses: ./.github/workflows/ci.yml

  # ① 前端静态导出（一次），产物给交叉编译各平台复用
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② 五平台交叉编译（内嵌前端）+ 打 zip
  binaries:
    needs: [frontend, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX 自解压 ELF 在部分 Linux 内核、虚拟化和安全策略下会崩溃。
          # Release 使用 Go linker 裁剪和 zip 压缩，优先保证可移植性。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Linux 生二进制单独上传，供 docker job 复用（免在镜像里重编前端+Go）
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # ③ 汇总所有 zip → 创建 GitHub Release
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          # 正文取仓库里的 RELEASE_NOTES.md（打 tag 前写好）：自动生成的提交列表
          # 附在其后。此前正文只有一行 compare 链接 —— 没人话。
          body_path: RELEASE_NOTES.md
          generate_release_notes: true

  # ④ 多架构镜像 → 推 ghcr.io（复用 binaries 编好的 Linux 二进制，
  #    镜像里只装工具 + 放二进制；arm64 仅需模拟 apt 层，构建快很多）
  docker:
    needs: binaries
    runs-on: ubuntu-latest
    # 冒烟要用真数据库：应用启动时连库并跑迁移，没有库它根本起不来，
    # 也就验不出「镜像能不能用」。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4 # 取 Dockerfile 与 skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/artex-linux-amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/artex-linux-arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          # 推 ghcr.io：包与本仓库天然绑定，GITHUB_TOKEN 即可推。
          # 原来的 Docker Hub 目标（autumn27/artex）已 404，且那是上游作者的
          # 命名空间 —— fork 无权推自己的镜像到那里去。
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/wufufu770/reartex
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 必填：构建期会跑一次装进去的二进制，核对它自报的版本与本次构建期望的
          # 版本一致。缺了它，那个路径下若是旧文件，镜像照样构建成功，
          # 旧二进制就被静默装了进去。ref_name 与 binaries job 注入的版本同源
          # （校验脚本会剥掉 tag 的 v 前缀）。
          build-args: |
            ARTEX_BINARY_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 发布后冒烟：把刚推上去的镜像拉回来真跑一次，确认它能起来、
      # 且报出来的版本就是这次发布的 tag。
      #
      # 构建期的校验只证明了「镜像里的二进制版本对」；镜像本身能不能起、
      # 启动脚本和工具链齐不齐，之前没有任何一处验过 —— 而这正是用户
      # docker compose up 之后立刻会遇到的那一步。
      - name: 冒烟刚发布的镜像
        run: |
          image="ghcr.io/wufufu770/reartex:${{ github.ref_name }}"
          for i in $(seq 1 12); do
            if docker pull --platform linux/amd64 "$image"; then break; fi
            echo "拉取 $image 失败，重试（第 $i 次）"; sleep 10
          done
          # --network host：服务容器的 Postgres 是通过 runner 的端口映射露在
          # localhost:5432 的，而 docker run 起的容器在独立网络里，它自己的
          # localhost 是容器自己 —— 不共享网络命名空间就永远连不上那个库，
          # 冒烟会卡在「应用起不来」而不是真正验到东西。
          # 口令走只读 secret 文件（与 compose 的供给形态一致）：放在 environment
          # 里的话，容器配置面与进程环境块里都留着它 —— 那正是新加的环境块洁净性门
          # 要拦的东西。（这扇门第一次上线就抓到了本冒烟脚本自己的违规。）
          printf 'postgres://artex:artex@localhost:5432/artex?sslmode=disable' > "$RUNNER_TEMP/pg_dsn"
          chmod 600 "$RUNNER_TEMP/pg_dsn"
          cid=$(docker run -d --network host \
            -v "$RUNNER_TEMP/pg_dsn:/run/secrets/pg_dsn:ro" \
            -e ARTEX_PG_DSN_FILE=/run/secrets/pg_dsn "$image")
          for i in $(seq 1 40); do
            if curl -sf -m 3 http://127.0.0.1:8787/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          got=$(sed -n 's/.*"version":"\([^"]*\)".*/\1/p' /tmp/health.json)
          want="${GITHUB_REF_NAME#v}"
          if [ "$got" != "$want" ]; then
            echo "刚发布的镜像版本不符：期望 $want，实际 ${got:-（读不到 /api/health）}"
            docker logs "$cid" || true
            docker rm -f "$cid" || true
            exit 1
          fi
          echo "版本核对通过：$got"
          # 交付前的环境块洁净性验收：进程树内不得有非空的平台秘密。
          # 放在 docker rm 之前 —— 容器删了就验不到了。
          #
          # ptrace 那条（verify-ptrace-blocked.sh）**刻意不进这道阻断门**：
          # 同 UID 进程读父进程内存并不需要 CAP_SYS_PTRACE（Docker 默认能力集
          # 本就不含它），实测仍然读得到 —— 这条残留要靠「工具进程与 artex
          # 不同 UID」才能闭合，属 per-task 隔离那一档。脚本留在镜像里供
          # 运维自查，不作为发布门。
          docker exec "$cid" /usr/local/bin/verify-secret-env.sh 1
          docker rm -f "$cid"
