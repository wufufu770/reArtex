name: ci

# 三种触发：
#   push / pull_request —— PR 与分支推送的常规门
#   workflow_call      —— 供 release.yml 复用：打 tag 发布前也必须过这道门
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # ① Go 侧：编译 + vet + 全量测试
  #
  # 必须带 Postgres：server / agent / db / evidence 等包的测试用 ARTEX_PG_DSN
  # 建库、跑真实读写并清理数据。没有库时这些用例会因「未找到数据库配置」而失败，
  # 门就成了摆设 —— 这正是此前「无测试 CI」掩盖掉的状态。
  go-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # 已知断测（基线即红，与安全加固无关）：
      #   TestGraphOverviewExpandsAssociatedCompanyScope
      #   它断言 graph_overview 的 coverage.scope 含公司范围展开，而生产代码
      #   （agent/tools.go 的 coverage 构造）尚未接线该字段 —— 测试超前于实现。
      #   单独排除而不是把门开成红的：门必须能绿才有约束力。修好该功能后
      #   请把这条排除去掉，让它重新进门。
      - name: go test
        run: go test ./... -skip 'TestGraphOverviewExpandsAssociatedCompanyScope'

  # ② 前端：静态构建
  #
  # 不把 biome lint 设为门：仓库现有 lint 基线本身是红的（134 errors / 138 warnings，
  # 集中在既有文件），设为门等于永久失败、无人再看。先只保证前端能构建。
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
