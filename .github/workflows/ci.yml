name: ci

# 三种触发：
#   push / pull_request —— PR 与分支推送的常规门
#   workflow_call      —— 供 release.yml 复用：打 tag 发布前也必须过这道门
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # ① Go 侧：编译 + vet + 全量测试
  #
  # 必须带 Postgres：server / agent / db / evidence 等包的测试用 ARTEX_PG_DSN
  # 建库、跑真实读写并清理数据。没有库时这些用例会因「未找到数据库配置」而失败，
  # 门就成了摆设 —— 这正是此前「无测试 CI」掩盖掉的状态。
  go-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # 已知断测（一条，在基线 1b29664 上同样失败，与本次加固无关）：
      #
      #   TestSideUsageRecordedOnceOnConsumerCancellation（llmrec 包）
      #     包内测试互相干扰：单独跑通过、整包跑失败，基线同样如此。
      #
      # 单独排除而不是把门开成红的：门必须能绿才有约束力。修好后请把排除去掉。
      #
      # -timeout 30m：db / server 两个包要跑真实数据库读写，加班时单包可能
      # 逼近 go test 默认的 10 分钟上限而被打断 —— 那是超时不是失败。
      #
      # 不再排除任何用例：各测试包现在各自用独立的库（internal/testdb 按包名
      # 派生并重建），互不可见，套件可重复。共享一个库时每次全量跑挂的用例
      # 都不一样（基线上一次挂 10 个、一次挂 16 个），门只能开成红的。
      # 顺带的好处：测试不再往开发库里灌数据。
      - name: go test
        run: go test ./... -timeout 30m

  # ② 前端：静态构建 + lint 门
  #
  # lint 门是**棘轮**：只查相对基线改动的文件（biome --changed --since）。
  # 仓库现有 lint 基线本身是红的（134 errors / 138 warnings，集中在既有文件），
  # 全量设为门等于永久失败、之后就没人再看它了。棘轮只要求新写的代码干净，
  # 旧账另开清理任务逐步还 —— 门因此能一直绿着有约束力。
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # biome --changed --since 要能取到基线 ref，浅克隆取不到。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - name: lint（仅相对基线改动的文件）
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          BASE="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "没有可比较的基线 ref（首推或历史缺失），跳过 lint 门"
            exit 0
          fi
          cd web
          npx biome check --changed --since="$BASE"
