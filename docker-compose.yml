services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    image: ghcr.io/wufufu770/reartex:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    # 显式去掉 CAP_SYS_PTRACE：Docker 默认能力集本就不含它，写出来是为了让
    # 意图不靠默认值兜底 —— 万一将来换用自定义 seccomp 或 --privileged，
    # 这一条仍在。
    #
    # 注意它**不解决**「同 UID 进程读父进程内存」：内核对同 UID 的 ptrace
    # 并不要求该能力（实测仍然读得到）。那条要靠工具进程与 artex 不同 UID
    # 才能闭合，属 per-task 隔离那一档。
    cap_drop:
      - SYS_PTRACE
    environment:
      ARTEX_DISABLE_SHORT_CIRCUIT: ${ARTEX_DISABLE_SHORT_CIRCUIT:-}
      # 口令走 secret 文件，不进容器配置面：docker inspect 看不到。
      ARTEX_PG_DSN_FILE: /run/secrets/pg_dsn
      # 迁移连接（超级用户）：只用于【启动期】补 Go 侧那批 DDL（llm_records /
      # llm_usage / strategy_* / task_strategy_snapshot*），应用读完即抹掉磁盘副本。
      # 运行期的一切业务读写都走受限角色 artex_app。
      ARTEX_PG_ADMIN_DSN_FILE: /run/secrets/pg_dsn_admin
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # B-01F：CVE 情报 sidecar 的冻结服务地址（compose 内网服务名）。此刻单体
      # 还没有消费方（客户端接线属 B-03G），多这一行行为零变化；sidecar 不在
      # 或不可达时单体照常启动，不得因它阻塞。
      CVE_MCP_URL: http://cve-mcp:8400
    secrets:
      - pg_dsn
      - pg_dsn_admin
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

  # B-01F：CVE 情报 sidecar —— 独立容器、独立数据卷（cvedata），故障不阻断
  # artex 启动（artex 对它没有 depends_on）。不发布任何端口：服务只在 compose
  # 内网按冻结地址 http://cve-mcp:8400 可达，宿主机与公网都摸不到。
  # 二进制取宿主机预编译产物（构建方式见 README「CVE 情报服务」一节）；产物
  # 缺失时本服务起不来（unhealthy 如实显示），artex 不受影响。
  # 基线复用运行镜像：glibc 与预编译二进制兼容、自带 curl（健康检查用），
  # 不为 sidecar 单独维护一套镜像。
  cve-mcp:
    image: ghcr.io/wufufu770/reartex:${ARTEX_TAG:-latest}
    entrypoint: ["/srv/cve-mcp/reartex-cve-mcp"]
    command: ["serve", ":8400"]
    environment:
      CVE_MCP_DB: /app/data/cve-mcp.db
      # 同步凭据（可选）只经 .env 注入，不写 compose 明文：
      NVD_API_KEY: ${NVD_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      # 只读挂模块目录取预编译二进制；数据走下面的独立卷，互不混写。
      - ./reartex-cve-mcp:/srv/cve-mcp:ro
      - cvedata:/app/data
    healthcheck:
      # sync-status 是两条无锁 SELECT 的只读面（B-03E 契约），当存活探针零副作用。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8400/api/cve/sync-status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

volumes:
  pgdata:
  # B-01F：CVE sidecar 独立数据卷——SQLite（cve-mcp.db）只在卷里持久化，
  # 与单体 PostgreSQL / artex data/ 完全隔离；不把 SQLite 依赖搬进主单体库。
  cvedata:

secrets:
  # 数据库连接串：由 init-pg-dsn-secret.sh 从 .env 生成（0600，不进版本库）。
  pg_dsn:
    file: ${PG_DSN_SECRET_FILE:-./secrets/pg_dsn}
  # 迁移连接（超级用户）：由 scripts/db-role-bootstrap.sh 生成（0600）。
  # 只在启动期用来补 Go 侧那批 DDL；运行期一律用受限角色。
  pg_dsn_admin:
    file: ${PG_ADMIN_DSN_SECRET_FILE:-./secrets/pg_dsn_admin}
