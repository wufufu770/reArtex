# 开发实例专用覆盖：独立项目 / 端口 / 网段 / 镜像 / 凭据。
# 用法（必须三个 -f 顺序）：
#   docker compose -p artexdev -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.dev.yml up -d
services:
  artex:
    image: artex-dev:local
    build:
      context: .
    # ⚠️ compose 对列表型字段是【合并】不是【覆盖】！
    # 基础 compose 的 ports 是 ["8787:8787", "127.0.0.1:8788:8788"]，
    # 若只追加不替换，开发实例会去抢【现役正在用的】8787/8788 → 端口冲突。
    # 必须用 !override 整体替换该列表（Compose ≥ v2.24 支持；本机 v2.40.3）。
    ports: !override
      - "127.0.0.1:18787:8787"
      - "127.0.0.1:18788:8788"
    environment:
      ARTEX_LLM_PROVIDER: "${ARTEX_LLM_PROVIDER:-}"
      ARTEX_LLM_MODEL: "${ARTEX_LLM_MODEL:-}"
      ARTEX_LLM_BASE_URL: "${ARTEX_LLM_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    # 仅开发实例：保留 CAP_SYS_ADMIN，以便 Phase 0 Task 4 的 Layer 2a
    # （mount namespace 隔离 / unshare -m）可执行。
    # **仅开发实例有此项**；现役 compose 一律不加（见隔离方案 §1 红线 R7）。
    cap_add:
      - SYS_ADMIN
    # 仅开发实例：解除 AppArmor 对 `mount(2)` 的封禁。
    # 实测（2026-10-29）：宿主 AppArmor=enabled，容器内 profile = docker-default (enforce)，
    # 它**禁止 mount** → Phase 0 Task 4 的 Layer 2a（mount namespace 里遮蔽 /run/secrets）
    # 在默认策略下**根本跑不起来**（bind / tmpfs 全部 EPERM）。
    # 对照实验已证实：仅放开 apparmor（seccomp 保持默认）后，
    # `unshare -m --propagation unchanged` + `mount --bind` / `mount -t tmpfs` 均可执行。
    # **仅开发实例有此项**；现役一律不加（见隔离方案 §1 红线 R7）。
    security_opt:
      - apparmor=unconfined

networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16
